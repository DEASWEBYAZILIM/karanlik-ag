<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karanlık Ağ - Karargah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>KARANLIK AĞ</h1>
        
        <!-- GİRİŞ & KAYIT EKRANI -->
        <div id="login-screen" class="modul">
            <div class="sekme-menu">
                <button type="button" class="sekme-btn aktif" onclick="authSekme('giris')">Giriş Yap</button>
                <button type="button" class="sekme-btn" onclick="authSekme('kayit')">Kayıt Ol</button>
            </div>

            <!-- GİRİŞ FORMU -->
            <div id="form-giris">
                <h3>Ağa Bağlan</h3>
                <input type="text" id="login-username" placeholder="Kullanıcı Adı">
                <input type="password" id="login-pass" placeholder="Şifre">
                <button type="button" onclick="sistemeGiris()">Sisteme Gir</button>
            </div>

            <!-- KAYIT FORMU -->
            <div id="form-kayit" class="gizli">
                <h3>Yeni Ajan Kaydı</h3>
                <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
                <input type="password" id="reg-pass" placeholder="Şifre">
                <select id="reg-meslek">
                    <option value="madenci">Veri Madencisi (Kripto Üretir)</option>
                    <option value="teknisyen">Enerji Teknisyeni (Enerji Üretir)</option>
                    <option value="kimyager">Biyokimyager (Kimyasal Üretir)</option>
                </select>
                <button type="button" onclick="sistemeKayit()" style="background:#004400; color:#00ff00; border:1px solid #00ff00; padding:12px; width:100%; font-weight:bold; cursor:pointer;">Kayıt Ol ve Katıl</button>
            </div>
        </div>

        <!-- ANA OYUN EKRANI -->
        <div id="game-screen" class="gizli">
            <div class="sekme-menu">
                <button type="button" class="sekme-btn aktif" onclick="sekmeDegistir('karargah')">Karargah (Üretim)</button>
                <button type="button" class="sekme-btn" onclick="sekmeDegistir('pazar')">Karaborsa (Ticaret)</button>
            </div>

            <!-- KARARGAH SEKMESİ -->
            <div id="sekme-karargah" class="modul">
                <h2 id="oyuncu-adi">Ajan</h2>
                <p>Meslek: <span id="oyuncu-meslek" style="color:#00ffcc">...</span></p>
                <p>Bakiye: <strong id="oyuncu-bakiye" style="color:#ffd700">0</strong> Kredi</p>
                
                <h3>Depo</h3>
                <div class="flex-row">
                    <div class="kutu">Kripto<br><strong id="inv-kripto">0</strong></div>
                    <div class="kutu">Enerji<br><strong id="inv-enerji">0</strong></div>
                    <div class="kutu">Kimyasal<br><strong id="inv-kimyasal">0</strong></div>
                </div>

                <h3>Üretim Tesisi</h3>
                <p id="uretim-bilgi" class="meslek-uyari">...</p>
                <button type="button" onclick="uretimYap()">ÜRETİMİ BAŞLAT</button>
            </div>

            <!-- PAZAR SEKMESİ -->
            <div id="sekme-pazar" class="modul gizli">
                <h2>KARABORSA</h2>
                <p class="meslek-uyari">Fiyatlar oyuncuların alım-satımına göre anlık değişir!</p>
                
                <div class="flex-row" style="margin-bottom: 10px;">
                    <div class="kutu">Kripto Fiyatı<br><strong id="fiyat-kripto" style="color:red">0</strong> Kredi</div>
                    <div class="kutu">Enerji Fiyatı<br><strong id="fiyat-enerji" style="color:red">0</strong> Kredi</div>
                    <div class="kutu">Kimyasal Fiyatı<br><strong id="fiyat-kimyasal" style="color:red">0</strong> Kredi</div>
                </div>

                <select id="pazar-urun">
                    <option value="kripto">Kripto</option>
                    <option value="enerji">Enerji</option>
                    <option value="kimyasal">Kimyasal</option>
                </select>
                <input type="number" id="pazar-miktar" placeholder="Miktar (Örn: 5)" value="1" min="1">
                
                <div class="flex-row">
                    <button type="button" onclick="pazardanAl()">SATIN AL</button>
                    <button type="button" onclick="pazaraSat()" style="background:#440000; border-color:red;">SAT</button>
                </div>
            </div>
        </div>
    </div>

    <!-- GİZLİ KAPI -->
    <div id="surum-bilgisi" onclick="gizliKapiKontrol()">v1.0.0</div>

    <script type="module" src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/market.js"></script>
</body>
</html>
